[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmod"
version = "0.1.0"
description = "Compression-first codebase retrieval agent, built with Paritok"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Prefer CPU torch first to avoid multi-GB CUDA wheels:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install -e ".[paritok]"
paritok = [
  "paritok[proxy]",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ragmod = "ragmod.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragmod*"]

[tool.setuptools.package-data]
ragmod = ["bench/tasks.json"]
